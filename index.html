<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sweet Trance"><meta name="format-detection" content="telephone=no">
<title>Sweet Trance</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#121214;--panel:#1b1b1f;--panel2:#232329;--line:#2e2e36;--ink:#ececec;--mut:#9a9aa2;--dim:#6e6e78;--acc:#8fb4ff;--cy:#5fd4ff;--red:#e06565;--pink:#ff7eb6;--ok:#62c98a;--fs:17px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
header h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:1.5px;display:block}
.chip{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--mut);white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--mut)}
.iconbtn:active{background:var(--panel2)}
#chat{flex:1;overflow-y:auto;padding:6px 0 20px;scroll-behavior:auto}
.msg{padding:6px 16px;position:relative}
.msg.ai .story{font-family:"Noto Serif","Source Serif 4",Georgia,serif;font-size:var(--fs);line-height:1.62}
.story p{margin:0 0 1.05em;color:var(--mut)}
.story p.dl{color:var(--ink)}
.story p.dl b{font-weight:500}
.story .q{color:var(--ink)}
.story em{font-style:italic}
.story .sys{color:var(--cy);font-family:ui-monospace,Menlo,monospace;font-size:.82em;line-height:1.5;margin:0 0 1em;padding:8px 10px;border-left:2px solid var(--cy);background:rgba(95,212,255,.06);border-radius:0 8px 8px 0}
.phone{margin:0 0 1.1em auto;max-width:82%;background:#203a2c;color:#e9fff1;border-radius:16px 16px 4px 16px;padding:8px 12px;font-family:system-ui,sans-serif;font-size:.86em;line-height:1.45}
.phone .ph{font-size:11px;color:#9fe0b7;letter-spacing:.5px;margin-bottom:2px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:85%;white-space:pre-wrap;font-size:15.5px;line-height:1.5}
.more{position:absolute;right:6px;top:2px;color:var(--dim);font-size:18px;padding:4px 8px;opacity:.7}
.msg.user .more{position:static;align-self:flex-start}
.locbar{margin:10px 0 14px;display:flex;align-items:center;gap:8px;color:var(--acc);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-family:system-ui,sans-serif}
.locbar:after{content:"";flex:1;height:1px;background:var(--line)}
.scene{margin:6px -16px 16px;position:relative}
.scene img{width:100%;max-height:260px;object-fit:cover;display:block}
.scene span{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:8px;font:600 12px system-ui;letter-spacing:1px;color:#fff}
/* portrait card */
.pcard{position:relative;margin:4px -16px 14px;overflow:hidden;background:#0b0b0d;border-top:1px solid #2b2b33;border-bottom:1px solid #2b2b33}
.pcard img,.pcard .ph{display:block;width:100%;height:min(78vw,430px);object-fit:cover;object-position:50% 18%}
.pcard .ph{display:flex;align-items:center;justify-content:flex-end;padding-right:9%;height:300px!important;font:700 64px/1 Georgia,serif;color:rgba(255,255,255,.55);letter-spacing:4px}
.pcard .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,7,10,.92) 0%,rgba(6,7,10,.72) 34%,rgba(6,7,10,0) 62%);padding:18px 18px;display:flex;flex-direction:column;gap:10px;font-family:system-ui,sans-serif;pointer-events:none}
.pcard .brand{font-size:9px;letter-spacing:2px;color:#aab;opacity:.85}
.pcard .brand b{display:block;font-size:13px;letter-spacing:2.5px;color:#dde;font-weight:500;margin-top:2px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.25);max-width:150px}
.pcard .lab{font-size:9px;letter-spacing:2px;color:#99a;margin-bottom:1px}
.pcard .big{font:600 30px/1.05 Georgia,"Noto Serif",serif;letter-spacing:2px;color:#fff;text-transform:uppercase;max-width:210px;word-break:break-word}
.pcard .val{font-size:12px;letter-spacing:1.6px;color:#e4e4ea;text-transform:uppercase;max-width:190px}
.pcard .emo{position:absolute;right:10px;bottom:10px;font:600 10px system-ui;letter-spacing:1.5px;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;text-transform:uppercase}
.pcard .crn{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.55)}
.pcard .c1{left:6px;top:6px;border-right:0;border-bottom:0}.pcard .c2{right:6px;top:6px;border-left:0;border-bottom:0}
.pcard .c3{left:6px;bottom:6px;border-right:0;border-top:0}.pcard .c4{right:6px;bottom:6px;border-left:0;border-top:0}
/* info chart */
.info{margin:6px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-family:system-ui,sans-serif}
.info summary{list-style:none;padding:12px 16px;background:var(--panel2);font-weight:600;letter-spacing:1px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between}
.info summary::-webkit-details-marker{display:none}
.info .body{padding:14px 16px;font-size:14.5px;line-height:1.65;color:#ddd}
.info .o{color:#f0a36b}.info .h{margin:14px 0 2px;font-size:15px}.info .rule{width:44px;height:2px;background:#888;margin:6px 0 10px}
.info .rc{margin:0 0 10px}
/* composer */
#composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
#composer .box{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
#composer .btns{display:flex;gap:8px;align-items:center}
.cbtn.round{border-radius:50%}
#inp{border:0;background:transparent;padding:8px 0;max-height:160px;min-height:24px;resize:none;font-size:16px;line-height:1.4}
#inp:focus{outline:none}
.cbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);font-size:18px;flex:none}
#send{background:#f2f2f2;color:#111;border:0}
#send.stop{background:var(--red);color:#fff}
.hint{font-size:12px;color:var(--dim);padding:4px 6px 0}
.suggs{display:flex;flex-direction:column;gap:10px;margin:4px 0 14px}
.sg{display:flex;gap:8px;align-items:stretch}
.sg .se,.sg .ss{flex:none;width:46px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);font-size:18px}
.sg .se:active,.sg .ss:active{background:var(--panel2)}
.sg .st{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:"Noto Serif",Georgia,serif;font-size:calc(var(--fs) - 1px);line-height:1.5;color:var(--ink);text-align:left}
.sg .st em{font-style:normal;color:var(--dim)}
.sgh{display:flex;justify-content:space-between;align-items:center;font:11px system-ui;letter-spacing:1.4px;color:var(--dim);margin-top:4px}
.sgh button{color:var(--mut);font-size:12px;letter-spacing:.5px}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--panel);border-radius:18px 18px 0 0;z-index:60;display:none;flex-direction:column;max-width:820px;margin:0 auto;border:1px solid var(--line)}
.sheet.on{display:flex}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;margin:0;font-size:18px}
.sheet .sb{overflow-y:auto;padding:14px 16px 30px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.tab{border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;color:var(--mut);font-size:14px}
.tab.on{background:#f2f2f2;color:#111;border-color:#f2f2f2;font-weight:600}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line);font-size:16px;width:100%;text-align:left}
.menu-item span{font-size:20px;width:28px;text-align:center}
.menu-item small{display:block;color:var(--dim);font-size:12.5px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14.5px}
.btn.pri{background:#f2f2f2;color:#111;border-color:#f2f2f2;font-weight:600}
.btn.red{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{margin:0 0 14px}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left}
.gc .t{aspect-ratio:3/4;background:#0d0d10;display:grid;place-items:center;overflow:hidden}
.gc .t img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.gc .t .ini{font:700 30px Georgia,serif;color:rgba(255,255,255,.8)}
.gc .n{padding:6px 8px 8px;font-size:13px;line-height:1.25}
.gc .n small{display:block;color:var(--dim);font-size:11px}
.gc.place .t{aspect-ratio:16/9}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.slot{background:#0d0d10;border:1px dashed var(--line);border-radius:10px;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;position:relative;color:var(--dim);font-size:12px}
.slot img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.slot b{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px;text-align:center;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}
.kv div:nth-child(odd){color:var(--dim)}
.mem{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--panel2)}
.mem summary{padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.mem summary small{color:var(--dim);font-weight:400}
.mem .mb{padding:0 14px 12px;font-size:14.5px;line-height:1.55;color:#ddd;white-space:pre-wrap}
.fab{position:sticky;bottom:10px;margin-left:auto;display:block;width:52px;height:52px;border-radius:50%;background:#f2f2f2;color:#111;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
/* cards (commands) */
.card{margin:6px 16px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-family:system-ui,sans-serif}
.card .ch{padding:10px 14px;font-size:11px;letter-spacing:1.5px;color:var(--acc);display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.card .cb{padding:12px 14px;font-size:14.5px;line-height:1.55}
.scan{background:linear-gradient(135deg,#0b2433,#0e1a24);border:1px solid #2a8fb8;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:stretch}
.scan .sp{width:40%;min-width:110px;border:2px solid var(--cy);clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);overflow:hidden;background:#071118;display:grid;place-items:center}
.scan .sp img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.scan .sp .ini{font:700 34px Georgia,serif;color:var(--cy)}
.scan .sd{flex:1;display:flex;flex-direction:column;gap:6px}
.scan .sys{font:11px ui-monospace,monospace;color:#8ef0a0}
.scan .r{background:#eaf6fb;color:#0b2433;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.scan .r i{font-style:normal;color:#2a6f8f;font-weight:500;margin-right:6px}
.scanimg{width:100%;border-radius:10px;display:block}
.deny{color:var(--red);font:600 14px ui-monospace,monospace;text-align:center;padding:16px;border:1px solid var(--red);border-radius:10px;background:rgba(224,101,101,.08)}
.bar{height:8px;background:#333;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c86b9a,#ff9fc9)}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.sec{font-size:11px;letter-spacing:1.4px;color:var(--dim);margin:12px 0 4px}
.pill{display:inline-block;margin:2px 4px 2px 0;padding:3px 9px;border-radius:999px;background:var(--panel2);font-size:13px}
.like{color:#ff9fc9}.dis{color:#e0b45a}
table.board{width:100%;border-collapse:collapse;font-size:13.5px}
table.board td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.board .pf{color:var(--acc);font-size:11.5px;white-space:nowrap}
table.board small{color:var(--dim)}
.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#f2f2f2;color:#111;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none;max-width:90%}
.pop{position:fixed;z-index:80;background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:170px;display:none;overflow:hidden}
.pop button{display:block;width:100%;text-align:left;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.pop button:last-child{border-bottom:0}
.cmdlist button{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.cmdlist b{color:var(--acc);font-family:ui-monospace,monospace}
.cmdlist small{display:block;color:var(--dim)}
.full{position:fixed;inset:0;background:#000;z-index:95;display:none;align-items:center;justify-content:center}
.full img{max-width:100%;max-height:100%}
.full.on{display:flex}
.typing{color:var(--dim);font-style:italic;font-size:14px;padding:4px 0 10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:auto;transform:scale(1.4)}
/* ---- riftwalker ---- */
header h1{font-size:17px}
.story .sys{color:var(--cy)}
.info .warn{color:#ff6b8a;font-weight:600}.info .secret{color:#c9a4ff;font-size:13px}.info .hyp{color:#d7a4ff;font-size:13px}
.qcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.ql{font-size:13px;color:var(--dim);line-height:1.5}.ql span{color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;margin-right:3px}
.mrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
.mrow .ci{flex:1;min-width:0}.mrow small{display:block;color:var(--dim);font-size:12px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.hpb{height:7px;background:#333;border-radius:99px;overflow:hidden;margin:5px 0 2px}.hpb i{display:block;height:100%;border-radius:99px;transition:width .4s}
.btn[disabled]{opacity:.45}.btn.gold{background:linear-gradient(135deg,#e9c46a,#d49a2a);color:#1b1307;border-color:#e9c46a;font-weight:700}
#battle{position:fixed;inset:0;z-index:70;background:#0c0c0e;display:none;overflow-y:auto}
#battle.on{display:block}
.bp{max-width:520px;margin:0 auto;padding:14px 14px 30px}
.bbox{background:#1b1b1f;border:1px solid #2e2e36;border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.blab{font-size:11px;color:var(--acc);letter-spacing:1px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.blog{background:#0d0d10;border:1px solid #1f1f25;border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.55;color:#cfcfd4;min-height:58px;margin:10px 0;max-height:190px;overflow-y:auto}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bb{background:#1b1b1f;border:1px solid #2e2e36;border-radius:10px;padding:10px;text-align:left;color:#ececec;font-size:14px;width:100%}
.bb small{display:block;font-size:11.5px;color:#9a9aa2;margin-top:2px}.bb.c{text-align:center}
.chip3{border:1px solid #2e2e36;border-radius:99px;padding:6px 12px;font-size:12.5px;color:#9a9aa2;background:none}.chip3.on{background:#f2f2f2;color:#111}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:start}
.shiny{color:#ffe066}
.kink{width:100%;min-height:90px}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* ---- iPhone / iPad ---- */
html{-webkit-text-size-adjust:100%}
html,body{height:100%;height:100dvh;overscroll-behavior:none}
#app{height:100%;height:100dvh}
header{padding-top:calc(10px + env(safe-area-inset-top))}
input,textarea,select{font-size:16px}
#chat,#battle,.sb{-webkit-overflow-scrolling:touch}
#battle .bp{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.sheet{padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){#battle .bp{max-width:640px}.bb{font-size:15px}}
/* Sweet Trance */
:root{--acc:#e58fc0}
.info .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7}
.info .s{color:#7fd68f}.info .gn{color:#f3f3f3;font-weight:600}.info .ig{margin:8px 0 6px}.info small{color:var(--mut)}.info .dimt{color:var(--dim)}
.meter{display:inline-block;width:70px;height:6px;background:#333;border-radius:99px;margin-left:8px;vertical-align:middle;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#e58fc0,#ff5a7a)}
.kk{display:inline-block;background:#33163d;color:#e2b8ff;border-radius:7px;padding:0 7px;margin:2px 2px 0 0;font-size:12px}
.story p.thought{color:#e7d3ff;font-weight:600;font-family:system-ui,sans-serif;font-size:.9em;background:rgba(160,110,220,.08);border-left:2px solid #a06edc;padding:6px 10px;border-radius:0 8px 8px 0}
.story p.thought span{display:block;font-size:11px;letter-spacing:1px;color:#b495dd;font-weight:500;margin-bottom:2px}
.spic{position:relative;margin:4px -16px 14px;background:#0b0b0d;border-top:1px solid #2b2b33;border-bottom:1px solid #2b2b33}
.spic img{display:block;width:100%;max-height:min(92vw,520px);object-fit:cover;object-position:50% 25%}
.spic span{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:8px;font:600 12px system-ui;letter-spacing:1px;color:#fff;text-transform:uppercase}
.pgallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pg{background:var(--panel2);border-radius:10px;overflow:hidden}.pg img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pg .pt{padding:5px 7px;font-size:12px}.pg .pt small{color:var(--dim)}.pg .row{padding:0 6px 6px;gap:4px}.pg .btn{padding:4px 8px;font-size:12px}
</style></head><body>
<div id="app">

    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.86)); }; img.src = r.result; }; r.readAsDataURL(file); });
}

  $('#tp').oninput = () => $('#tv').textContent = $('#tp').value;
  $('#fs').oninput = () => { $('#fv').textContent = $('#fs').value; document.documentElement.style.setProperty('--fs', $('#fs').value + 'px'); };
  const collect = () => { stash(); const on = $('#nsfw').checked; Object.assign(SET, {provider:cur, fallback:$('#fb').checked, nsfw:on, ntr:on && $('#ntr').checked, preg:on && $('#preg').checked, hypnoMe:on && $('#hyp').checked, sugg:$('#sgt').checked, pics:$('#pics').checked, thoughts:$('#tht').checked,
    player:$('#pn').value.trim() || SET.player || 'Player', gender:$('#pg').value, age:Math.max(21, parseInt($('#pa').value) || 21), job:$('#pj').value.trim(), temp:+$('#tp').value, maxTok:+$('#mt2').value || 8192, ctx:+$('#cx').value || 30, fs:+$('#fs').value}); };
  $('#lm').onclick = async () => { collect(); try { const ms = await listModels(cur); $('#mlist').innerHTML = ms.map(m => `<option value="${esc(m)}">`).join(''); toast(ms.length + ' models loaded'); } catch (e) { toast(e.message); } };
  $('#tst').onclick = async () => { collect(); toast('Testing…'); try { let o = ''; await streamOne(cur, 'Reply with exactly: OK', [{role:'user', text:'Say OK'}], t => o += t); toast('Connected ✓ ' + o.trim().slice(0, 30)); } catch (e) { toast(e.message); } };
  $('#ss').onclick = async () => { collect(); await saveSet(); applySet(); forceClose(); toast('Saved'); renderAll(true); };
}
function savesSheet() {
  openSheet('Saves', `<div class="menu-item" style="display:block"><b>Story save</b><p class="note">Messages, the girls, people, memories.</p><div class="row"><button class="btn pri" id="exs">Export save</button><button class="btn" id="ims">Import save</button></div></div>
  <div class="menu-item" style="display:block"><b>Your pictures</b><p class="note">Pictures you added yourself (built-in ones are always there).</p><div class="row"><button class="btn pri" id="exp">Export pictures</button><button class="btn" id="imp">Import pictures</button></div></div>
  <div class="menu-item" style="display:block"><b>New game</b><p class="note">Start over on Dec 1. Settings and kink lists are kept.</p><button class="btn red" id="ng">Start new game</button></div><input type="file" id="fImp" accept=".json,application/json" hidden><input type="file" id="fImpP" accept=".json,application/json" hidden>`);
  $('#exp').onclick = () => USERPICS.length ? download('sweet-trance-pictures.json', {kind:'sweet-trance-pics', pics:USERPICS}) : toast('No pictures of your own yet');
  $('#imp').onclick = () => $('#fImpP').click();
  $('#fImpP').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (j.kind !== 'sweet-trance-pics') return toast('Wrong file type'); let n = 0; for (const p of j.pics || []) if (p && p.d && !USERPICS.some(x => x.d === p.d)) { USERPICS.push({id:'u' + uid(), who:p.who, tag:p.tag, d:p.d}); n++; } await saveUserPics(); renderAll(true); toast(n + ' pictures imported'); } catch (err) { toast('Could not read file'); } };
  $('#exs').onclick = () => download(`sweet-trance-${dateLabel(S.time.day).replace(' ', '')}.json`, {kind:'sweet-trance-save', MSGS, S, MEM});
  $('#ims').onclick = () => $('#fImp').click();
  $('#fImp').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (j.kind !== 'sweet-trance-save' || !j.MSGS) return toast('Wrong file type'); MSGS = j.MSGS; S = loadState(j.S); MEM = j.MEM || MEM; await save(); renderAll(); forceClose(); toast('Save loaded'); } catch (err) { toast('Could not read file'); } };
  $('#ng').onclick = () => ask('Start a new game? The current story will be replaced.', async () => { freshGame(); await save(); renderAll(); forceClose(); });
}
function loadState(s) { const f = freshState(); const n = {...f, ...s}; n.girls = {...f.girls, ...(s.girls || {})}; GIRLS.forEach(g => n.girls[g] = {...f.girls[g], ...n.girls[g]}); return n; }
function setupSheet() {
  openSheet('Sweet Trance', `<p>December. Your parents are abroad, and you and your stepsister Saya have the house to yourselves. Nora from next door has never been subtle. And Saya has an app on her phone with a violet spiral on it…</p>
  <div class="field"><label>Your name</label><input id="su_n" value="${esc(SET.player || '')}"></div>
  <div class="field"><label>Gender</label><div style="display:flex;flex-direction:column;gap:8px">${[['man', 'Man', 'he/him'], ['woman', 'Woman', 'she/her'], ['diverse', 'Diverse', 'they/them']].map(([v, l, p]) => `<label style="display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px"><input type="radio" name="su_g" value="${v}" style="width:auto"${SET.gender === v ? ' checked' : ''}> ${l} <small style="color:var(--dim)">${p}</small></label>`).join('')}</div></div>
  <div class="field"><label>Age (21 or older)</label><input id="su_a" type="number" min="21" value="${Math.max(21, SET.age || 25)}"></div>
  <div class="field"><label>Job</label><input id="su_j" value="${esc(SET.job || '')}" placeholder="e.g. office worker, nurse, game developer"></div>
  <div class="switch"><div>18+<div class="note">Explicit scenes between adults.</div></div><input type="checkbox" id="su_x"${SET.nsfw ? ' checked' : ''}></div>
  <div class="switch"><div>Hypnosis on me<div class="note">LULL always works on you. Needs 18+. !wake ends a trance.</div></div><input type="checkbox" id="su_h"${SET.hypnoMe ? ' checked' : ''}></div>
  <p class="note">NTR and Pregnancy start off; Settings has them. Your kink lists are under ☰ → Kinks.</p><button class="btn pri" id="su_go" style="width:100%">Come home</button>`);
  $('#shClose').style.visibility = 'hidden';
  $('#su_go').onclick = async () => { const n = $('#su_n').value.trim(); const g = ($('[name=su_g]:checked') || {}).value; const a = parseInt($('#su_a').value); if (!n) return toast('Enter a name'); if (!g) return toast('Choose a gender'); if (!(a >= 21)) return toast('You must be 21 or older');
    const x = $('#su_x').checked; Object.assign(SET, {player:n, gender:g, age:a, job:$('#su_j').value.trim(), nsfw:x, hypnoMe:x && $('#su_h').checked, setupDone:true}); await saveSet(); $('#shClose').style.visibility = 'visible'; forceClose(); renderAll();
    if (!Object.values(SET.keys || {}).some(Boolean)) setTimeout(() => { settingsSheet(); toast('Add your API key to start'); }, 300); };
}
async function boot() {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  try {
    const st = await kvGet('settings'); if (st) SET = {...DEF_SET, ...st}; SET.keys = SET.keys || {}; SET.models = SET.models || {}; if (!PROVIDERS[SET.provider]) SET.provider = 'cohere';
    const sv = await kvGet('save'); if (sv && sv.MSGS) { MSGS = sv.MSGS; S = loadState(sv.S); MEM = sv.MEM || MEM; } else freshGame();
  } catch (e) { if (!S) freshGame(); showCrash('Problem while loading: ' + e.message); }
  await loadUserPics(); applySet(); renderAll();
  $('#send').onclick = send; $('#inp').addEventListener('input', autoGrow);
  $('#inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(); } });
  $('#menuBtn').onclick = mainMenu; $('#pplBtn').onclick = peopleSheet; $('#cmdBtn').onclick = cmdSheet; $('#sugBtn').onclick = refreshSugg;
  $('#thBtn').onclick = async () => { SET.thoughts = !SET.thoughts; await saveSet(); renderAll(true); toast('Inner thoughts ' + (SET.thoughts ? 'on' : 'off')); };
  $('#astBtn').onclick = () => { const t = $('#inp'), a = t.selectionStart, b = t.selectionEnd, v = t.value; t.value = v.slice(0, a) + '*' + v.slice(a, b) + '*' + v.slice(b); t.focus(); t.setSelectionRange(a + 1, b + 1); autoGrow(); };
  $('#veil').onclick = closeSheet; $('#shClose').onclick = closeSheet; $('#shBack').onclick = () => sheetBack && sheetBack();
  document.addEventListener('click', e => { if (Date.now() - popAt < 350) return; if (!e.target.closest('#pop') && !e.target.closest('.more')) hidePop(); });
  $('#chat').addEventListener('click', e => {
    const ch = e.target.closest('[data-ch]'); if (ch) { const [id, i] = ch.dataset.ch.split('|'); return choose(id, +i); }
    if (e.target.closest('[data-sgr]')) return refreshSugg();
    const sg = e.target.closest('[data-sgs],[data-sge]'); if (sg) { const m = MSGS[lastAIIndex()]; const j = +(sg.dataset.sgs ?? sg.dataset.sge); if (m && m.sugg && m.sugg[j]) { $('#inp').value = m.sugg[j]; autoGrow(); if (sg.dataset.sgs != null) send(); else $('#inp').focus(); } return; }
    const b = e.target.closest('.more'); if (b) { e.stopPropagation(); msgMenu(+b.dataset.i, e); }
  });
  if (!SET.setupDone) setupSheet(); else if (!Object.values(SET.keys || {}).some(Boolean)) setTimeout(() => { settingsSheet(); toast('Add your API key to start'); }, 400);
}
boot();
</script></body></html>
